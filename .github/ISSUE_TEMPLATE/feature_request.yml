name: feature_request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        免费版采用 Open Core 模式：核心业务主线永久免费，商业版提供托管与增值服务。
        你的建议会进入社区需求池，优先级参考反馈热度排序。

  - type: dropdown
    id: module
    attributes:
      label: 希望改进哪个模块
      options:
        - 经营（概览 / 订单 / 导入）
        - 零售管理
        - 销售管理
        - 采购管理
        - 仓库管理
        - 财务管理
        - 报表查询
        - 系统管理
        - 流程中心
        - 平台对接（新增电商平台）
        - WordPress 插件
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的业务问题
      description: 先说清楚痛点，比直接说「要个按钮」更容易被采纳
      placeholder: 每次月底对账都要手工导出三张表再拼……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 选填

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与方式
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
        - label: 我愿意协助测试 / 提供业务规则细节
          required: false
